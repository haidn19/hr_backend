services:
  mysql:
    image: mysql:8.4
    container_name: mysql-db
    profiles: [local-db]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: ${BACKEND_IMAGE:-haidn19/hrm-backend:v1}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    image: ${FRONTEND_IMAGE:-haidn19/hrm-frontend:v1}
    build:
      context: ../Frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8080/api
    restart: unless-stopped
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mysql_data:
