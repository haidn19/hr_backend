spring.application.name=${APP_NAME:hr-backend}
spring.config.import=optional:file:.env[.properties]

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.example.demo=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:WARN}
logging.level.org.hibernate=${LOGGING_LEVEL_HIBERNATE:WARN}

logging.file.name=${LOGGING_FILE_NAME:logs/application.log}
logging.logback.rollingpolicy.file-name-pattern=logs/application.log.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=${LOGGING_MAX_FILE_SIZE:20MB}

# Archive cleanup is performed by LogArchiveCleanupJob at 01:00 Asia/Ho_Chi_Minh.
app.log-cleanup.directory=${LOG_CLEANUP_DIRECTORY:logs}
app.log-cleanup.cron=${LOG_CLEANUP_CRON:0 0 1 * * *}
app.log-cleanup.zone=${LOG_CLEANUP_ZONE:Asia/Ho_Chi_Minh}
app.log-cleanup.retention-days=${LOG_CLEANUP_RETENTION_DAYS:2}

app.monthly-task.cron=${MONTHLY_TASK_CRON:0 0 10 5 * *}
app.monthly-task.zone=${MONTHLY_TASK_ZONE:Asia/Ho_Chi_Minh}

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{traceId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{traceId}] %logger{36} - %msg%n

# Connection details are loaded from the ignored .env file or deployment
# environment. There are deliberately no defaults for credentials.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# spring.datasource.hikari.connection-timeout=20000
# spring.datasource.hikari.maximum-pool-size=5

server.port=${SERVER_PORT:8080}

# Comma-separated origin patterns. In production set this to the exact frontend
# domain(s); do not allow wildcard deployment domains when credentials are used.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

app.holidays=${APP_HOLIDAYS:}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# OUTBOUND EMAIL
# Mail.tm is the recipient inbox, not an SMTP server. Set these values to the
# credentials of the SMTP provider used to send email (for example Brevo, Gmail,
# Microsoft 365, or the company's SMTP service). See .env.example.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}
spring.mail.default-encoding=${MAIL_DEFAULT_ENCODING:UTF-8}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# Sender address must be accepted by the configured SMTP provider.
app.mail.from=${MAIL_FROM}
# Optional: for testing, set this to one address created at mail.tm. Every
# outgoing message will then be delivered to that inbox instead of the employee.
app.mail.recipient-override=${MAIL_RECIPIENT_OVERRIDE:}
